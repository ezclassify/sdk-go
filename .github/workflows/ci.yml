name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full:
        description: Also run the release-only job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one required check. Steps run cheapest first and stop at the first
  # failure.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # spec/MANIFEST.json is editable in a pull request, so its values are read
      # inside the script and never interpolated into the shell.
      - name: Verify spec hash
        run: |
          python3 - <<'PY'
          import hashlib, json, sys
          expected = json.load(open('spec/MANIFEST.json'))['openapiSha256']
          actual = hashlib.sha256(open('spec/openapi.yaml', 'rb').read()).hexdigest()
          if expected != actual:
              sys.exit(f'spec/openapi.yaml SHA mismatch\n  MANIFEST: {expected}\n  actual:   {actual}')
          PY

      # Generation and consumer tests use the supported, patched Go floor.
      - name: Set up Go for code generation
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: true

      # vendor/ carries upstream module sources verbatim, so the gofmt gate
      # covers first-party code only.
      - name: Format
        run: test -z "$(gofmt -l . | grep -v '^vendor/')"

      - name: Verify generator module hash
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          gen = json.load(open('spec/MANIFEST.json'))['generators']['go']
          out = subprocess.run(
              ['go', 'mod', 'download', '-json', f"github.com/oapi-codegen/oapi-codegen/v2@{gen['version']}"],
              check=True, capture_output=True, text=True).stdout
          actual = json.loads(out)['Sum']
          if gen['sha256'] != actual:
              sys.exit(f"generator module hash mismatch\n  MANIFEST: {gen['sha256']}\n  actual:   {actual}")
          PY

      # Module ages only grow, so the quarantine and license gates can change
      # their answer only when a go.mod or go.sum changes. Manual runs have no
      # base to compare; the full job sweeps them unconditionally.
      - name: Detect dependency changes
        id: deps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=false
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --name-only "$BASE_SHA" HEAD | grep -v '^vendor/' | grep -Eq '(^|/)go\.(sum|mod)$'; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Quarantine gate: refuses any third-party module version, in every
      # go.sum in the repository, that the module index shows proxy.golang.org
      # first cached inside the last seven days.
      - name: Dependency age (third-party, 7 days)
        if: steps.deps.outputs.changed == 'true'
        run: go run ./tools/dependencyage

      # License gate and notices freshness. Regenerate deliberately with
      # 'make notices' after a dependency change.
      - name: Dependency licenses and third-party notices
        if: steps.deps.outputs.changed == 'true'
        run: go run ./tools/notices

      # Verifies that generated code matches what the generator produces from
      # spec/openapi.yaml; fails on hand-edits or template tampering.
      - name: Regenerate
        run: bash scripts/regen.sh

      - name: Generated code matches the committed tree
        run: |
          if ! git diff --exit-code; then
            echo "Generated code differs from the committed tree."
            echo "Run 'bash scripts/regen.sh' locally and commit the result."
            exit 1
          fi

      - name: Build
        run: go build ./...

      # 1.0 public-surface freeze: tools/apisurface diffs the live exported
      # surface against api/1.0.txt. Regenerate deliberately with
      # 'make api-surface' after an API review.
      - name: API surface (1.0 freeze)
        run: go run ./tools/apisurface

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The Build step already compiles the examples from vendor/. This step
      # runs each binary and checks its documented flag surface.
      - name: Examples (startup smoke)
        run: |
          for ex in basic go-classify server-tour; do
            go build -o "$RUNNER_TEMP/ezc-example-$ex" "./examples/$ex"
            out=$("$RUNNER_TEMP/ezc-example-$ex" -h 2>&1) || { echo "$ex: -h exited $?"; echo "$out"; exit 1; }
            echo "$out" | grep -q -- '-server' || { echo "$ex: usage is missing the -server flag"; exit 1; }
            echo "smoke ok: $ex"
          done

      # govulncheck reports findings in the standard library of whatever
      # toolchain it runs under, so it runs last with the current Go release
      # rather than the consumer floor above. The scanner stays pinned.
      - name: Set up current Go for the vulnerability scan
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"
          cache: true

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Working tree is clean after build
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  # Release evidence. Dispatch "CI" with full=true on the release commit.
  full:
    name: full
    if: github.event_name == 'workflow_dispatch' && inputs.full
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Dependency age (third-party, 7 days)
        run: go run ./tools/dependencyage

      - name: Dependency licenses and third-party notices
        run: go run ./tools/notices
